# fly.toml app configuration file generated for ikr-whatsapp-bridge on 2026-11-17T15:09:28Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ikr-whatsapp-bridge'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  AUTH_DIR = '/data/auth'
  LOG_LEVEL = 'info'
  PORT = '8080'

[[mounts]]
  source = 'wa_auth'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
